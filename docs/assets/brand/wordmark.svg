<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 128" width="600" height="128"
     role="img" aria-labelledby="wt wd">
  <title id="wt">poka-yoke</title>
  <desc id="wd">The poka-yoke lockup: an andon signal tower beside the name.</desc>
  <!--
    The tower is bare here rather than badged: a lockup already sits on a surface, and a badge
    inside a banner is a box inside a box. Same shading as the mark, minus the halo, which
    needs the badge's dark ground to read.

    The name is LIVE TEXT in a system sans stack, so it renders with whatever font the viewer
    has. For a banner, an OG image or a slide, use the PNG export beside this file.
  -->
<defs>
    <!-- cylinder: darker at both edges, brightest just left of centre -->
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000" stop-opacity=".38"/>
      <stop offset=".16"  stop-color="#000" stop-opacity=".10"/>
      <stop offset=".38"  stop-color="#fff" stop-opacity=".26"/>
      <stop offset=".62"  stop-color="#000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
    <!-- a lit lens is brighter at the top of its own segment -->
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity=".20"/>
      <stop offset=".40" stop-color="#fff" stop-opacity=".02"/>
      <stop offset="1"   stop-color="#000" stop-opacity=".20"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#5c6672"/>
      <stop offset=".34" stop-color="#aeb7c2"/>
      <stop offset=".62" stop-color="#7d8794"/>
      <stop offset="1"   stop-color="#4b535e"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#34d399" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#34d399" stop-opacity=".05"/>
      <stop offset="1"   stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="wtube"><path d="M 24 31 A 15 15 0 0 1 54 31 L 54 84 L 24 84 Z"/></clipPath>
  </defs>
  <g clip-path="url(#wtube)">
    <rect x="24" y="16" width="30" height="23" fill="#34d399"/>
    <rect x="24" y="39" width="30" height="23" fill="#fbbf24"/>
    <rect x="24" y="62" width="30" height="22" fill="#ff4d4d"/>
    <rect x="24" y="16" width="30" height="23" fill="url(#lit)"/>
    <rect x="24" y="39" width="30" height="23" fill="url(#lit)"/>
    <rect x="24" y="62" width="30" height="22" fill="url(#lit)"/>
    <rect x="24" y="16" width="30" height="68" fill="url(#cyl)"/>
    <rect x="30.5" y="19" width="2.6" height="62" rx="1.3" fill="#fff" opacity=".20"/>
  </g>
  <rect x="24" y="84" width="30" height="17" rx="3" fill="url(#steel)"/>
  <rect x="24" y="84" width="30" height="1.2" fill="#fff" opacity=".22"/>
  <rect x="17" y="100" width="44" height="9" rx="4" fill="url(#steel)"/>
  <rect x="17" y="100" width="44" height="1.2" rx=".6" fill="#fff" opacity=".18"/>
  <text x="88" y="82" fill="currentColor"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="60" font-weight="650" letter-spacing="-1.6">poka-yoke</text>
</svg>
