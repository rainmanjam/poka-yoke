<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d">
  <title id="t">The three poka-yoke inspection lenses</title>
  <desc id="d">Contact: a keyed part seats only one way round, the reversed part is refused. Fixed-value: a counter refuses five of six. Motion-step: step three is unreachable until step two has run.</desc>

  <style>
    .lbl  { font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #d97757; letter-spacing: .08em; }
    .ask  { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8a8a8a; }
    .num  { font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #8a8a8a; }
    .part { stroke-width: 2; }
    .ok   { fill: #2f9e6f26; stroke: #2f9e6f; }
    .no   { fill: #c8503c26; stroke: #c8503c; }
    .jig  { fill: #8a8a8a1f; stroke: #8a8a8a; stroke-width: 2; }
    .gd   { stroke: #2f9e6f; stroke-width: 2; fill: none; }
    .bd   { stroke: #c8503c; stroke-width: 2; fill: none; }
    .dsh  { stroke: #c8503c; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
  </style>

  <!-- ══ 1. CONTACT ══ -->
  <text class="lbl" x="30" y="30">CONTACT</text>
  <text class="ask" x="30" y="52">Can the wrong thing fit?</text>

  <!-- Correct part, keyed, descending into its slot. Each part is centred on the slot
       beneath it (slots at 64–120 and 180–236), and the slot pair is centred in the plate:
       the pair spans 64–236, centre 150, matching the plate's 30–270. -->
  <path class="part ok" d="M64 96 h56 l-10 22 h-36 z"/>
  <path class="gd" d="M92 124 v16 m0 0 l-5-6 m5 6 l5-6"/>
  <!-- reversed part, refused -->
  <path class="part no" d="M180 118 h56 l-10-22 h-36 z"/>
  <path class="bd" d="M201 128 l14 14 m0-14 l-14 14"/>

  <!-- the jig: a plate with two keyed slots -->
  <path class="jig" d="M30 150 h240 v44 h-240 z"/>
  <path d="M64 150 h56 l-10 22 h-36 z" fill="#ffffff00" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M180 150 h56 l-10 22 h-36 z" fill="#ffffff00" stroke="#8a8a8a" stroke-width="2"/>
  <text class="ask" x="30" y="222">The slot has a shape.</text>
  <text class="ask" x="30" y="240">Only one orientation seats.</text>

  <!-- ══ 2. FIXED-VALUE ══ -->
  <text class="lbl" x="330" y="30">FIXED-VALUE</text>
  <text class="ask" x="330" y="52">Is the set complete?</text>

  <!-- Six positions spanning 337–563, centre 450, matching the block's 330–570. -->
  <g>
    <circle cx="350" cy="112" r="13" class="part ok"/>
    <circle cx="390" cy="112" r="13" class="part ok"/>
    <circle cx="430" cy="112" r="13" class="part ok"/>
    <circle cx="470" cy="112" r="13" class="part ok"/>
    <circle cx="510" cy="112" r="13" class="part ok"/>
    <circle cx="550" cy="112" r="13" class="no" stroke-dasharray="4 3" stroke-width="2"/>
  </g>
  <path class="gd" d="M344 106 l5 6 l9-11" />
  <path class="gd" d="M384 106 l5 6 l9-11" />
  <path class="gd" d="M424 106 l5 6 l9-11" />
  <path class="gd" d="M464 106 l5 6 l9-11" />
  <path class="gd" d="M504 106 l5 6 l9-11" />

  <path class="jig" d="M330 150 h240 v44 h-240 z"/>
  <text class="num" x="350" y="178">5 / 6</text>
  <text x="404" y="178" font="400 12px sans-serif" fill="#c8503c"
        style="font: 600 12px ui-monospace, Menlo, monospace">REFUSED</text>
  <text class="ask" x="330" y="222">A counter, not a checklist.</text>
  <text class="ask" x="330" y="240">Five of six will not release.</text>

  <!-- ══ 3. MOTION-STEP ══ -->
  <text class="lbl" x="630" y="30">MOTION-STEP</text>
  <text class="ask" x="630" y="52">Is the order right?</text>

  <!-- Three steps spanning 653–847, centre 750, matching the block's 630–870. -->
  <circle cx="670" cy="112" r="17" class="part ok"/>
  <text class="num" x="666" y="117" style="fill:#2f9e6f">1</text>
  <circle cx="750" cy="112" r="17" class="part ok"/>
  <text class="num" x="746" y="117" style="fill:#2f9e6f">2</text>
  <circle cx="830" cy="112" r="17" class="part ok"/>
  <text class="num" x="826" y="117" style="fill:#2f9e6f">3</text>

  <path class="gd" d="M689 112 h42 m0 0 l-7-5 m7 5 l-7 5"/>
  <path class="gd" d="M769 112 h42 m0 0 l-7-5 m7 5 l-7 5"/>
  <!-- the skip, refused, arc apex sits at 750, over step 2 -->
  <path class="dsh" d="M674 92 q76 -42 152 0"/>
  <path class="bd" d="M744 62 l12 12 m0-12 l-12 12"/>

  <path class="jig" d="M630 150 h240 v44 h-240 z"/>
  <text class="num" x="650" y="178">1 &#8594; 3</text>
  <text x="712" y="178" style="font: 600 12px ui-monospace, Menlo, monospace; fill:#c8503c">REFUSED</text>
  <text class="ask" x="630" y="222">Step 3 does not exist</text>
  <text class="ask" x="630" y="240">until step 2 has run.</text>
</svg>
